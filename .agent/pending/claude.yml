# INSTALL: git mv -f .agent/pending/claude.yml .github/workflows/claude.yml
# (update for #285: adds the `agent:claude` label trigger; every `@claude` path is unchanged.
#  Shipped here because the Claude GitHub App cannot write to .github/workflows/)
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.action != 'labeled' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'agent:claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Label routing (#285): adding `agent:claude` runs Claude exactly like an `@claude` mention.
      # An issue created with the label AND an `@claude` mention fires both `opened` and `labeled`;
      # the `opened` run already covers it, so a fresh issue (< 2 min) that mentions @claude skips here.
      # Only users with triage rights or above can add labels, so this is as gated as an @claude mention.
      - name: Gate label double-fire
        id: gate
        if: github.event_name == 'issues' && github.event.action == 'labeled'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const ageMs = Date.now() - new Date(issue.created_at).getTime();
            const mentioned = `${issue.title}\n${issue.body || ''}`.includes('@claude');
            if (mentioned && ageMs < 120000) {
              core.notice('Issue was just opened with an @claude mention; the opened-event run covers it. Skipping the labeled run.');
              core.setOutput('skip', 'true');
            }

      - name: Run Claude Code
        id: claude
        if: steps.gate.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          label_trigger: "agent:claude"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # Model policy (Sasha, 2026-10-16): Sonnet by default (~80% of tasks). Label `model:opus` (or `model:latest`)
          # for architecture/specs/synthesis -> latest Opus alias; `model:haiku` for routine pipeline work. Max 3 concurrent runs.
          claude_args: >-
            --model ${{ (contains(github.event.issue.labels.*.name, 'model:opus') || contains(github.event.pull_request.labels.*.name, 'model:opus') || contains(github.event.issue.labels.*.name, 'model:latest') || contains(github.event.pull_request.labels.*.name, 'model:latest')) && 'opus' || ((contains(github.event.issue.labels.*.name, 'model:haiku') || contains(github.event.pull_request.labels.*.name, 'model:haiku')) && 'haiku' || 'sonnet') }}
            --effort high
            --allowedTools "Bash(npm ci),Bash(npm install),Bash(npm run build),Bash(npm run lint),Bash(gh pr create:*),Bash(gh pr view:*),Bash(git:*),WebFetch,WebSearch"

