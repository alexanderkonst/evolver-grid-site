# INSTALL: git mv .agent/pending/agent-automerge.yml .github/workflows/agent-automerge.yml
# (shipped here because the Claude GitHub App cannot write to .github/workflows/)
name: Agent Auto-merge

# Agent PRs merge themselves the moment they are green. Event-driven, no polling, no cron.
# Rule + guards are documented in .agent/RULES.md -> "Agent PR auto-merge".
# Each run sweeps every open agent PR (a superset of "the PR affected by this event").

on:
  workflow_run:
    # Every OTHER workflow in this repo. Do NOT list "Agent Auto-merge" here: it would re-trigger itself forever.
    # When you add a workflow, add its `name:` to this list.
    workflows: ["Claude Code", "Corpus Drift Check"]
    types: [completed]
  check_suite:
    types: [completed]
  pull_request:
    types: [opened, synchronize, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted]
  workflow_dispatch: {}

# One sweep at a time; a newer queued run supersedes an older queued one, and every sweep covers all PRs.
concurrency:
  group: agent-automerge
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
  statuses: read # combined commit status (legacy status API)

jobs:
  automerge:
    # Keep this job name stable: the sweep ignores its own check run by this name.
    name: agent-automerge
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate and merge agent PRs
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ github.token }}
          # Optional PAT / app token. Comments posted with GITHUB_TOKEN do not trigger claude.yml,
          # so the "@claude please rebase" nudge only wakes the agent when this secret is set.
          COMMENT_TOKEN: ${{ secrets.AGENT_AUTOMERGE_COMMENT_TOKEN }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const SELF_JOB = 'agent-automerge';
            const SELF_PATH = '.github/workflows/agent-automerge.yml';
            const OK = new Set(['success', 'neutral', 'skipped']);
            const REBASE_COMMENT = '@claude please rebase on main and resolve conflicts';
            const log = [];
            const decide = (pr, text) => {
              const line = `- #${pr.number} ${pr.head.ref}: ${text}`;
              log.push(line);
              core.info(line);
            };
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            // --- labels -------------------------------------------------------------
            for (const [name, color, description] of [
              ['hold', 'fbca04', 'Agent auto-merge: do not merge this PR'],
              ['needs-sasha', 'd93f0b', 'Agent auto-merge: touches irreversible surface, a human must merge'],
            ]) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
                core.info(`created label ${name}`);
              }
            }

            const commenter = process.env.COMMENT_TOKEN ? getOctokit(process.env.COMMENT_TOKEN) : github;

            // --- helpers ------------------------------------------------------------
            const isAgentPr = (pr) => {
              const byBot = pr.user && ['claude[bot]', 'claude'].includes(pr.user.login);
              const sameRepo = pr.head.repo && pr.head.repo.full_name === `${owner}/${repo}`;
              return byBot || (sameRepo && pr.head.ref.startsWith('claude/'));
            };

            const guardReason = async (pr) => {
              const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number, per_page: 100 });
              const rules = [
                [/^supabase\/migrations\//, 'touches supabase/migrations'],
                [/^\.github\/workflows\//, 'touches .github/workflows'],
                [/(^|\/)\.env([./]|$)|secret|credential|\.pem$|\.key$/i, 'touches secrets'],
                [/billing|payment|stripe|paypal|invoice/i, 'touches billing/payment code'],
              ];
              for (const [re, why] of rules) {
                const hit = files.find((f) => re.test(f.filename) || (f.previous_filename && re.test(f.previous_filename)));
                if (hit) return `${why} (${hit.filename})`;
              }
              const removed = files.filter((f) => f.status === 'removed').length;
              if (removed > 20) return `deletes ${removed} files (limit 20)`;
              return null;
            };

            const checksReason = async (sha) => {
              // Check runs
              const checkRuns = await github.paginate(github.rest.checks.listForRef, { owner, repo, ref: sha, per_page: 100 });
              const runs = checkRuns.filter((c) => c.name !== SELF_JOB);
              for (const c of runs) {
                if (c.status !== 'completed') return `check pending: ${c.name}`;
                if (!OK.has(c.conclusion)) return `check ${c.conclusion}: ${c.name}`;
              }
              // Workflow runs registered for this SHA (covers runs queued but without a check run yet)
              const wfRuns = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, { owner, repo, head_sha: sha, per_page: 100 });
              for (const w of wfRuns.filter((w) => w.path !== SELF_PATH)) {
                if (w.status !== 'completed') return `workflow run pending: ${w.name}`;
                if (!OK.has(w.conclusion)) return `workflow run ${w.conclusion}: ${w.name}`;
              }
              // Legacy commit statuses
              const combined = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: sha });
              if (combined.data.total_count > 0 && combined.data.state !== 'success') return `commit status ${combined.data.state}`;
              // Nothing at all registered yet -> too early to call it green
              if (runs.length === 0 && combined.data.total_count === 0 && wfRuns.filter((w) => w.path !== SELF_PATH).length === 0) {
                return 'no checks reported yet';
              }
              return null;
            };

            const reviewReason = async (pr) => {
              const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: pr.number, per_page: 100 });
              const blocking = new Map(); // per reviewer: decisive state (COMMENTED never clears it)
              const latestBot = new Map(); // per bot reviewer: latest review incl. COMMENTED (PR-critic verdict lives in the body)
              for (const r of reviews) {
                if (!r.user || r.state === 'PENDING') continue;
                if (['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(r.state)) blocking.set(r.user.login, r.state);
                if (r.user.type === 'Bot') latestBot.set(r.user.login, r);
              }
              for (const [who, state] of blocking) if (state === 'CHANGES_REQUESTED') return `changes requested by ${who}`;
              for (const [who, r] of latestBot) {
                if (/verdict\W{0,5}(changes[ _-]requested|request[ _-]changes)/i.test(r.body || '')) return `PR-critic (${who}) verdict: changes requested`;
              }
              return null;
            };

            const loadPr = async (number) => {
              let pr;
              for (let i = 0; i < 4; i++) {
                pr = (await github.rest.pulls.get({ owner, repo, pull_number: number })).data;
                if (pr.mergeable !== null) break; // null = GitHub still computing
                await sleep(3000);
              }
              return pr;
            };

            // --- sweep ----------------------------------------------------------------
            const open = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
            let merged = 0;

            for (const listed of open.filter(isAgentPr)) {
              try {
                const pr = await loadPr(listed.number);
                const labels = pr.labels.map((l) => l.name);

                if (pr.draft) { decide(pr, 'skipped, draft'); continue; }
                if (labels.includes('hold')) { decide(pr, 'skipped, label `hold`'); continue; }
                if (labels.includes('needs-sasha')) { decide(pr, 'skipped, label `needs-sasha`'); continue; }

                const guard = await guardReason(pr);
                if (guard) {
                  await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ['needs-sasha'] });
                  await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: `Not auto-merging: ${guard}. Labelled \`needs-sasha\`; a human merges this one.` });
                  decide(pr, `skipped, guard: ${guard} -> labelled needs-sasha`);
                  continue;
                }

                if (pr.mergeable === false || pr.mergeable_state === 'dirty') {
                  const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 });
                  if (comments.some((c) => (c.body || '').includes(REBASE_COMMENT))) {
                    decide(pr, 'skipped, conflicts (rebase already requested)');
                  } else {
                    await commenter.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: REBASE_COMMENT });
                    decide(pr, 'skipped, conflicts -> asked @claude to rebase');
                  }
                  continue;
                }
                if (pr.mergeable === null) { decide(pr, 'skipped, mergeability still unknown'); continue; }
                if (!['clean', 'has_hooks', 'unstable'].includes(pr.mergeable_state)) {
                  decide(pr, `skipped, mergeable_state=${pr.mergeable_state}`);
                  continue;
                }

                const checks = await checksReason(pr.head.sha);
                if (checks) { decide(pr, `skipped, ${checks}`); continue; }

                const review = await reviewReason(pr);
                if (review) { decide(pr, `skipped, ${review}`); continue; }

                await exec.exec('gh', ['pr', 'merge', String(pr.number), '--repo', `${owner}/${repo}`, '--squash', '--delete-branch', '--match-head-commit', pr.head.sha]);
                merged++;
                decide(pr, 'merged (squash, branch deleted)');
              } catch (e) {
                decide(listed, `skipped, error: ${e.message}`);
              }
            }

            // --- post-merge: GITHUB_TOKEN merges do not fire push workflows ---------------
            if (merged > 0) {
              const workflows = await github.paginate(github.rest.actions.listRepoWorkflows, { owner, repo, per_page: 100 });
              for (const w of workflows) {
                if (w.path === SELF_PATH || w.state !== 'active') continue;
                if (!/verify|docs[-_ ]?sync|post[-_ ]?merge/i.test(`${w.name} ${w.path}`)) continue;
                try {
                  const file = await github.rest.repos.getContent({ owner, repo, path: w.path, ref: 'main' });
                  const text = Buffer.from(file.data.content, 'base64').toString('utf8');
                  if (!/workflow_dispatch/.test(text)) { log.push(`- post-merge: ${w.name} has no workflow_dispatch, not triggered`); continue; }
                  await exec.exec('gh', ['workflow', 'run', String(w.id), '--repo', `${owner}/${repo}`, '--ref', 'main']);
                  log.push(`- post-merge: dispatched ${w.name} on main`);
                } catch (e) {
                  log.push(`- post-merge: ${w.name} dispatch failed: ${e.message}`);
                }
              }
            }

            if (log.length === 0) log.push('- no open agent PRs');
            await core.summary.addHeading('Agent auto-merge decisions', 3).addRaw(log.join('\n'), true).write();
