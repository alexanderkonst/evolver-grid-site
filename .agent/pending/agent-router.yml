# INSTALL: git mv .agent/pending/agent-router.yml .github/workflows/agent-router.yml
# (shipped here because the Claude GitHub App cannot write to .github/workflows/)
name: Agent Router

# Label routing for the swarm (#285). Docs: .agent/RULES.md -> "Swarm routing".
#   agent:claude  -> handled by claude.yml (same run as an @claude mention). Not here.
#   agent:codex   -> this file: runs only if repo secret OPENAI_API_KEY exists.
#   agent:gemini  -> this file: runs only if repo secret GEMINI_API_KEY exists.
# Secret missing -> ONE comment "secret missing" on the issue, job exits green.
# Secret present -> STUB: one comment saying the lane is armed. The runner is not wired yet
#   (no paid service is added by this file; wiring is a separate issue).
# Secrets are read into env only to test for emptiness. They are never echoed.
#
# workflow_dispatch = dry run: pick an issue and a lane without touching its labels.
#   Actions -> Agent Router -> Run workflow -> issue_number + agent.
#   Run it with `ensure_labels: true` once to create agent:* and needs-hark.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue to route (dry run on a test issue)"
        required: false
        type: string
      agent:
        description: "Lane to simulate"
        required: false
        type: choice
        options: [codex, gemini]
        default: codex
      ensure_labels:
        description: "Create the agent:* and needs-hark labels if missing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  ensure-labels:
    if: github.event_name == 'workflow_dispatch' && inputs.ensure_labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            for (const [name, color, description] of [
              ['agent:claude', '7057ff', 'Route this issue to Claude Code (same as an @claude mention)'],
              ['agent:codex', '10a37f', 'Route this issue to Codex (needs OPENAI_API_KEY)'],
              ['agent:gemini', '4285f4', 'Route this issue to Gemini (needs GEMINI_API_KEY)'],
              ['needs-hark', 'b60205', 'Second key said no or CI is red: Hark looks'],
            ]) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
                core.info(`label exists: ${name}`);
              } catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
                core.info(`created label: ${name}`);
              }
            }

  route:
    if: |
      (github.event_name == 'issues' && (github.event.label.name == 'agent:codex' || github.event.label.name == 'agent:gemini')) ||
      (github.event_name == 'workflow_dispatch' && inputs.issue_number != '' && !inputs.ensure_labels)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve lane and secret presence
        id: lane
        uses: actions/github-script@v7
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVENT_LABEL: ${{ github.event.label.name }}
          INPUT_AGENT: ${{ inputs.agent }}
          INPUT_ISSUE: ${{ inputs.issue_number }}
        with:
          script: |
            const lane = context.eventName === 'issues'
              ? process.env.EVENT_LABEL.replace('agent:', '')
              : process.env.INPUT_AGENT;
            const issue = context.eventName === 'issues'
              ? context.payload.issue.number
              : Number(process.env.INPUT_ISSUE);
            if (!['codex', 'gemini'].includes(lane) || !Number.isInteger(issue) || issue <= 0) {
              core.setFailed(`bad routing input: lane=${lane} issue=${issue}`);
              return;
            }
            const present = lane === 'codex'
              ? Boolean(process.env.OPENAI_API_KEY)
              : Boolean(process.env.GEMINI_API_KEY);
            const secretName = lane === 'codex' ? 'OPENAI_API_KEY' : 'GEMINI_API_KEY';
            core.setOutput('lane', lane);
            core.setOutput('issue', String(issue));
            core.setOutput('secret_name', secretName);
            core.setOutput('present', String(present));

            // One comment per (issue, lane, state). A re-label never spams.
            const state = present ? 'armed' : 'secret-missing';
            const marker = `<!-- agent-router:${lane}:${state} -->`;
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: issue, per_page: 100 });
            if (comments.some((c) => (c.body || '').includes(marker))) {
              core.notice(`already commented (${state}) for ${lane} on #${issue}`);
              return;
            }
            const body = present
              ? `${marker}\n**agent:${lane}** received. Secret \`${secretName}\` is configured. The ${lane} runner is a stub in this repo (no run started); wiring it is a separate issue.`
              : `${marker}\n**agent:${lane}**: secret missing. \`${secretName}\` is not set in this repository, so nothing ran. Add the secret (Settings → Secrets and variables → Actions) and re-add the label.`;
            await github.rest.issues.createComment({ owner, repo, issue_number: issue, body });
            core.notice(`commented on #${issue}: ${lane} ${state}`);
