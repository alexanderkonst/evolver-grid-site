<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commercial OS</title><link rel="stylesheet" href="./styles.css"></head><body>
<header><div><p class="eyebrow">EVOLVER · COMMERCIAL LEDGER</p><h1>One relationship, one history.</h1></div><div class="header-actions"><span id="connector-pill" class="pill">Offline</span><button data-action="settings">Settings</button><button data-action="backup">Backup</button><label class="button">Restore<input id="restore" type="file" accept="application/json" hidden></label></div></header>
<div id="notice" class="notice">Loading…</div>
<nav id="tabs"><button data-tab="find">Find</button><button data-tab="connections">Connections</button><button data-tab="relationships">Relationships</button><button data-tab="learnings">Learnings</button></nav>
<main><section id="view"></section></main>
<dialog id="settings-dialog"><form method="dialog"><div class="dialog-head"><h2>Settings & config</h2><button value="cancel">×</button></div><label>Connector mode<select id="connector-mode"><option value="rest">ConnectSafely REST</option><option value="mcp">Claude MCP</option></select></label><label>API / proxy base URL<input id="api-base" placeholder="https://your-proxy.example.com"></label><label>Personal API key (session only)<input id="api-key" type="password" autocomplete="off"></label><label>Config JSON<textarea id="config-editor" rows="18"></textarea></label><div class="dialog-actions"><button value="cancel">Cancel</button><button id="save-settings" value="default" class="primary">Save & reconnect</button></div></form></dialog>
<dialog id="confirm-dialog"><form method="dialog"><h2 id="confirm-title">Confirm</h2><p id="confirm-copy"></p><pre id="confirm-message"></pre><div class="dialog-actions"><button value="cancel">Cancel</button><button id="confirm-yes" value="default" class="primary">Confirm</button></div></form></dialog>
<script type="module" src="./src/app.js"></script></body></html>
