# QA as code (docs/templates/qa-pass.md, issue #460).
#
# MOVE THIS FILE to .github/workflows/qa-preview.yml. It lives in e2e/workflow/ only because the
# GitHub App that opened PR #460 may not write under .github/workflows/.
#   git mv e2e/workflow/qa-preview.yml .github/workflows/qa-preview.yml
#
# Runs the Playwright + axe suite in e2e/ against the PR's Vercel preview at 1440x900, 768x1024,
# 390x844 and desktop with reduced motion; uploads screenshots; edits one PR comment with the table.
# It reports. It does not block merge: leave it out of the required checks until it has run green twice.
#
# Optional secret: VERCEL_AUTOMATION_BYPASS_SECRET ("Protection Bypass for Automation" in the Vercel
# project settings), needed only if previews sit behind Deployment Protection.
name: QA pass (preview)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Run against this URL instead of waiting for a PR preview"
        required: false

concurrency:
  group: qa-pass-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: read
  pull-requests: write
  issues: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Never blocks: a red table is information, and a broken runner must not stop a merge either.
    continue-on-error: true
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # e2e/ has its own lockfile on purpose: the root package-lock.json is out of sync with package.json
      # (`npm ci` at the root fails), and the suite needs none of the app's dependencies.
      - name: Install the suite
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for the Vercel preview
        id: preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MANUAL_URL: ${{ github.event.inputs.preview_url }}
        run: |
          if [ -n "$MANUAL_URL" ]; then
            echo "url=$MANUAL_URL" >> "$GITHUB_OUTPUT"
          else
            node scripts/wait-for-preview.mjs
          fi

      - name: Run the QA pass
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          CI: "true"
        run: npx playwright test

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-pass-artifacts
          path: |
            e2e/artifacts/screenshots
            e2e/artifacts/html-report
            e2e/artifacts/report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Post the pass/fail table on the PR
        if: always() && github.event_name == 'pull_request' && hashFiles('e2e/artifacts/report.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/pr-comment.mjs
