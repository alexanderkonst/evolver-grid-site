<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Outreach Radar</title>
<style>
body{margin:0;background:#f4f2ec;color:#24231f;font:14px Inter,system-ui}.shell{max-width:1400px;margin:auto;padding:28px}h1{font:600 34px Georgia;margin:4px 0}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#766f63}.sub,.muted{color:#766f63}.card{background:#fff;border:1px solid #ddd7cb;border-radius:15px;padding:16px;margin-top:14px}.row,.tabs,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}.status{background:#efede6}.error{background:#ffefec;color:#92271d}button,.button,input,select,textarea{font:inherit}button,.button{border:1px solid #c8c0b2;background:#fff;border-radius:8px;padding:8px 11px;cursor:pointer}button.active,.primary{background:#25241f;color:#fff}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:9px;margin:12px 0}.person{display:grid;grid-template-columns:45px 1.2fr 1fr 1fr auto;gap:12px;border-top:1px solid #eeeae2;padding:14px 0}.avatar{width:40px;height:40px;border-radius:50%;background:#e9e5dc;display:grid;place-items:center;font-weight:700}.name{font-weight:700}.score,.tag{display:inline-block;padding:3px 7px;border-radius:8px;background:#e2f1e5}.tag{background:#efede7;font-size:11px}.mine{color:#195e9b}.theirs{color:#a15c00}.unknown{color:#976e21}.drawer{grid-column:2/-1;background:#f8f6f1;padding:12px;border-radius:10px}.hidden{display:none}textarea{width:100%;min-height:100px;border:1px solid #d2ccbf;border-radius:8px;padding:8px}@media(max-width:850px){.person{grid-template-columns:45px 1fr}.person>*:not(.avatar){grid-column:2}.filters{grid-template-columns:1fr}.shell{padding:15px}}
</style></head><body><main class="shell">
<div class="eyebrow">Canonical commercial ledger · Tool 2</div><h1>Outreach Radar</h1>
<div class="sub">Reconcile prospects, connections and conversations before outreach. Draft deliberately. Send only with confirmation.</div>
<div id="status" class="card status">Waiting for Connect Safely…</div>
<section class="card"><div class="row"><b>Data</b><label class="button">Import Tool 1<input id="import" type="file" accept="application/json" hidden></label><button id="crawl">Crawl next connections</button><button id="sync">Refresh conversations</button><span class="grow"></span><button id="backup">Backup</button><label class="button">Restore<input id="restore" type="file" accept="application/json" hidden></label><button id="export">Export ledger</button></div></section>
<section class="card"><div id="tabs" class="tabs"></div><div class="filters"><input id="search" placeholder="Search people, headline, ICP"><select id="sort"><option value="score">Best fit</option><option value="oldest">Oldest touch</option><option value="newest">Newest touch</option><option value="name">Name</option></select><label><input id="verified" type="checkbox"> Verified only</label></div><div id="list"></div><div id="empty" class="status">Import Tool 1 or crawl connections.</div></section>
</main><script>
(function(){
'use strict';
var KEY='evolver_outreach_radar_v1', $=function(s){return document.querySelector(s)}, bridge=null;
var TAB_NAMES={recommended:'Recommended',high_priority:'High priority',never_messaged:'Never messaged',all_conversations:'All conversations',owe_reply:'You owe a reply',waiting:'Waiting on them',drafts:'Drafts',sent:'Sent',done:'Done'};
var state={people:[],templates:{default:'Hi {first},\n\nYour work[[company: at {company}]] caught my attention. I help highly capable people name their next professional chapter and package it into a clear offer.\n\nWould a 45-minute Direction Call be useful?'},tab:'recommended',binding:{},ownerId:'',offset:0};
try{state=Object.assign(state,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
function show(m,e){$('#status').textContent=m;$('#status').className='card status'+(e?' error':'')}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){show('Storage quota reached. Save a backup now.',true);return false}}
function parse(r){if(r&&r.isError)throw Error((r.content&&r.content[0]&&r.content[0].text)||'Connector error');if(r&&r.structuredContent)return r.structuredContent;var t=r&&r.content&&r.content[0]&&r.content[0].text;if(t){try{return JSON.parse(t)}catch(e){return{text:t}}}return r||{}}
async function call(name,args){if(!bridge||!bridge.callMcpTool)throw Error('Connector unavailable');return parse(await bridge.callMcpTool(name,args))}
async function waitBridge(){for(var i=0;i<36;i++){bridge=window.cowork||globalThis.cowork;if(bridge&&bridge.callMcpTool){show('Connect Safely ready.');return}await new Promise(function(r){setTimeout(r,250)})}show('Offline mode. Open from Claude’s artifact card or restore a backup.',true)}
function slug(url){var m=String(url||'').match(/linkedin\.com\/in\/([^/?#]+)/i);return m?m[1]:''}
function company(h){var m=String(h||'').match(/(?:\bat\b|@)\s+([^|·,—]+?)(?=\s*[|·,—]|$)/i)||String(h||'').match(/(?:founder|co-founder|owner|ceo|principal)\s+(?:of\s+)?([^|·,—]+?)(?=\s*[|·,—]|$)/i);return m?m[1].trim():''}
function canonical(r,mechanism){var u=r.profileUrn||r.participantUrn||r.profileId||r.profileUrl;if(!u)throw Error('Person has no stable LinkedIn identity');return{id:'linkedin:'+u,profileUrn:u,profileId:r.profileId||slug(r.profileUrl),name:r.name||[r.firstName,r.lastName].filter(Boolean).join(' ')||'Unknown',firstName:r.firstName||'',headline:r.headline||r.currentPosition||'',location:r.location||'',profileUrl:r.profileUrl||'',score:Number(r.score||0),icpId:r.icpId||'unclassified',icpName:r.icpName||'Unclassified',reason:r.reason||'Imported relationship',source:r.source||{channel:'linkedin',mechanism:mechanism||'connection',capturedAt:new Date().toISOString()},commercial:r.commercial||{stage:'prospect',repliedAt:null,callAt:null,offerAt:null,paymentAt:null,deliveredAt:null,expansionAt:null},conversation:r.conversation||{verified:false,direction:'unknown',messageCount:0,lastActivityAt:null},conversationUrn:r.conversationUrn||'',draft:r.draft||'',sentAt:r.sentAt||null,done:Boolean(r.done),company:r.company||company(r.headline)}}
function merge(rows){var m=new Map(state.people.map(function(p){return[p.profileUrn,p]}));rows.forEach(function(raw){var p=canonical(raw,raw.source&&raw.source.mechanism),o=m.get(p.profileUrn);if(!o)m.set(p.profileUrn,p);else{var newer=+new Date((p.conversation&&p.conversation.lastActivityAt)||0)>=+new Date((o.conversation&&o.conversation.lastActivityAt)||0)?p.conversation:o.conversation;m.set(p.profileUrn,Object.assign({},o,p,{score:Math.max(o.score,p.score),source:o.source,commercial:Object.assign({},o.commercial,p.commercial),conversation:newer,draft:p.draft||o.draft,done:p.done||o.done}))}});state.people=Array.from(m.values())}
function conversation(messages){var a=messages.slice().sort(function(x,y){return +new Date(x.createdAt||x.sentAt||x.timestamp)-+new Date(y.createdAt||y.sentAt||y.timestamp)}),last=a[a.length-1];if(!last)return{verified:true,direction:'none',messageCount:0,lastActivityAt:null};var sid=String(last.senderId||''),mine=sid===state.ownerId||sid.endsWith(':'+state.ownerId),ts=last.createdAt||last.sentAt||last.timestamp;return{verified:true,direction:mine?'mine':'theirs',messageCount:a.length,lastActivityAt:ts,lastText:last.text||last.body||last.content||'',messages:a.slice(-14)}}
function advance(p){if(p.commercial.paymentAt)p.commercial.stage='paid';else if(p.commercial.offerAt)p.commercial.stage='offered';else if(p.commercial.callAt)p.commercial.stage='call';else if(p.conversation.direction==='theirs'){p.commercial.stage='replied';p.commercial.repliedAt=p.commercial.repliedAt||p.conversation.lastActivityAt}else if(p.sentAt||p.conversation.direction==='mine')p.commercial.stage='contacted'}
function flags(p){var c=p.conversation,d=c.lastActivityAt?Math.floor((Date.now()-new Date(c.lastActivityAt))/864e5):null;return{recommended:p.score>=60&&!p.done,high_priority:p.score>=60&&c.messageCount>0&&!p.done,never_messaged:c.verified&&c.messageCount===0&&!p.sentAt&&!p.done,all_conversations:c.messageCount>0&&!p.done,owe_reply:c.direction==='theirs'&&!p.done,waiting:c.direction==='mine'&&d>=5&&!p.done,drafts:Boolean(p.draft)&&!p.done,sent:Boolean(p.sentAt)&&!p.done,done:p.done}}
function convLabel(p){var c=p.conversation;if(!c.verified)return'Unverified';if(!c.messageCount)return'No conversation — confirmed';var d=Math.max(0,Math.floor((Date.now()-new Date(c.lastActivityAt))/864e5));return(c.direction==='mine'?'You sent last':'They replied last')+' · '+d+'d ago · '+c.messageCount+' msgs'}
function template(p){var t=state.templates[p.icpId]||state.templates.default;return t.replace(/\[\[company:\s*([\s\S]*?)\]\]/g,p.company?function(_,x){return x.replaceAll('{company}',p.company)}:'').replaceAll('{first}',p.firstName||p.name.split(' ')[0]||'there').replaceAll('{name}',p.name).replaceAll('{company}',p.company||'')}
function escapeHtml(s){return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function visible(){var q=String($('#search').value||'').toLowerCase(),a=state.people.filter(function(p){return flags(p)[state.tab]&&(!q||[p.name,p.headline,p.icpName].join(' ').toLowerCase().includes(q))&&(!$('#verified').checked||p.conversation.verified)}),sort=$('#sort').value;if(sort==='name')a.sort(function(x,y){return x.name.localeCompare(y.name)});else if(sort==='oldest')a.sort(function(x,y){return +new Date(x.conversation.lastActivityAt||0)-+new Date(y.conversation.lastActivityAt||0)});else if(sort==='newest')a.sort(function(x,y){return +new Date(y.conversation.lastActivityAt||0)-+new Date(x.conversation.lastActivityAt||0)});else a.sort(function(x,y){return y.score-x.score});return a}
function render(){var counts={};Object.keys(TAB_NAMES).forEach(function(id){counts[id]=state.people.filter(function(p){return flags(p)[id]}).length});$('#tabs').innerHTML=Object.keys(TAB_NAMES).map(function(id){return'<button data-tab="'+id+'" class="'+(state.tab===id?'active':'')+'">'+TAB_NAMES[id]+' <small>'+counts[id]+'</small></button>'}).join('');document.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){state.tab=b.dataset.tab;save();render()}});var rows=visible();$('#list').innerHTML=rows.map(function(p){var key=encodeURIComponent(p.profileUrn),initials=p.name.split(' ').slice(0,2).map(function(x){return x[0]}).join('');return'<article class="person"><div class="avatar">'+initials+'</div><div><a class="name" href="'+(p.profileUrl||'#')+'" target="_blank">'+escapeHtml(p.name)+'</a> <span class="score">'+p.score+'</span><div>'+escapeHtml(p.headline)+'</div><div class="muted">'+escapeHtml(p.location)+' · '+escapeHtml(p.icpName)+'</div></div><div><div class="'+p.conversation.direction+'">'+convLabel(p)+'</div><div class="muted">'+escapeHtml(p.reason)+'</div><span class="tag">'+p.commercial.stage+'</span></div><div><b>Last message</b><div class="muted">'+escapeHtml((p.conversation.lastText||'No message loaded').slice(0,180))+'</div></div><div class="actions"><button data-verify="'+key+'">Verify</button><button data-draft="'+key+'">Draft</button><button data-done="'+key+'">'+(p.done?'Reopen':'Done')+'</button></div><div id="d-'+key+'" class="drawer hidden"></div></article>'}).join('');$('#empty').classList.toggle('hidden',rows.length>0);wireRows()}
function find(u){return state.people.find(function(p){return p.profileUrn===u})}
function wireRows(){document.querySelectorAll('[data-verify]').forEach(function(b){b.onclick=function(){verify(decodeURIComponent(b.dataset.verify))}});document.querySelectorAll('[data-draft]').forEach(function(b){b.onclick=function(){openDraft(decodeURIComponent(b.dataset.draft))}});document.querySelectorAll('[data-done]').forEach(function(b){b.onclick=function(){var p=find(decodeURIComponent(b.dataset.done));p.done=!p.done;save();render()}})}
async function ensureTools(){var labels=['connections','conversations','messages','exists','send'];for(var i=0;i<labels.length;i++){var k=labels[i];if(!state.binding[k])state.binding[k]=prompt('Paste exact fully-qualified '+k+' tool name reported by Claude:')||''}if(!state.binding.accountId)state.binding.accountId=prompt('Paste accountId reported by Claude:')||'';save()}
async function crawl(){await ensureTools();try{show('Loading connections…');var d=await call(state.binding.connections,{accountId:state.binding.accountId,startIndex:state.offset,limit:250}),rows=d.connections||d.people||d.results||[];merge(rows);state.offset+=rows.length;save();render();show('Merged '+rows.length+' connections.')}catch(e){show(e.message,true)}}
async function sync(){await ensureTools();try{show('Loading conversations…');var d=await call(state.binding.conversations,{accountId:state.binding.accountId,count:100}),threads=d.conversations||d.items||d.results||[];for(var i=0;i<threads.length;i++){var t=threads[i],urn=t.conversationUrn||t.id;if(!urn)continue;if(!state.ownerId){var own=String(urn).match(/msg_conversation:\(urn:li:fsd_profile:([^,]+)/);state.ownerId=own?own[1]:''}show('Reading conversation '+(i+1)+'/'+threads.length);var md=await call(state.binding.messages,{accountId:state.binding.accountId,conversationUrn:urn}),msgs=md.messages||md.items||[],part=(t.participants||[]).find(function(x){return !String(x.profileUrn||x.participantUrn||'').includes(state.ownerId)})||t.participant||{};merge([Object.assign({},part,{conversationUrn:urn,conversation:conversation(msgs)})]);advance(state.people.find(function(p){return p.conversationUrn===urn})||state.people[state.people.length-1]);save();render();await new Promise(function(r){setTimeout(r,1000)})}show('Reconciled '+threads.length+' conversations.')}catch(e){show(e.message,true)}}
async function verify(u){await ensureTools();var p=find(u),id=p.profileId||slug(p.profileUrl);if(!id)return show('No vanity slug available for verification.',true);try{show('Verifying '+p.name+'…');var d=await call(state.binding.exists,{accountId:state.binding.accountId,profileId:id}),urn=d.conversationUrn||(d.conversation&&d.conversation.conversationUrn);if(urn){var md=await call(state.binding.messages,{accountId:state.binding.accountId,conversationUrn:urn});p.conversationUrn=urn;p.conversation=conversation(md.messages||md.items||[]);advance(p)}else p.conversation={verified:true,direction:'none',messageCount:0,lastActivityAt:null};save();render();show(p.name+': '+convLabel(p))}catch(e){show(e.message,true)}}
async function openDraft(u){var p=find(u);if(!p.conversation.verified){await verify(u);p=find(u)}var box=$('#d-'+encodeURIComponent(u));box.classList.remove('hidden');p.draft=p.draft||template(p);box.innerHTML='<textarea>'+escapeHtml(p.draft)+'</textarea><div class="actions"><button class="save">Save draft</button><button class="primary send">Send with confirmation</button></div>';var ta=box.querySelector('textarea');box.querySelector('.save').onclick=function(){p.draft=ta.value;save();render();show('Draft saved for '+p.name)};box.querySelector('.send').onclick=function(){send(p,ta.value)}}
async function send(p,text){if(!confirm('Send this LinkedIn message to '+p.name+'?\n\n'+text))return;await ensureTools();var targets=[];if(p.conversationUrn)targets.push({conversationUrn:p.conversationUrn});if(p.profileUrn)targets.push({recipientProfileUrn:p.profileUrn});if(p.profileId)targets.push({recipientProfileId:p.profileId});var errors=[];for(var i=0;i<targets.length;i++)for(var j=0;j<2;j++){var channel=j===0?'linkedin_inbox':'auto';try{await call(state.binding.send,Object.assign({accountId:state.binding.accountId,messagingChannel:channel,message:text},targets[i]));p.sentAt=new Date().toISOString();p.draft='';p.commercial.stage='contacted';save();render();show('Message sent to '+p.name+'. Refresh conversations to confirm.');return}catch(e){errors.push(Object.keys(targets[i])[0]+'/'+channel+': '+e.message)}}show('All send attempts failed: '+errors.join(' | '),true)}
function download(name,data){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
$('#import').onchange=async function(e){try{var x=JSON.parse(await e.target.files[0].text());merge(x.people||[]);save();render();show('Tool 1 ledger imported and merged.')}catch(err){show(err.message,true)}};$('#restore').onchange=async function(e){try{var x=JSON.parse(await e.target.files[0].text());merge(x.people||[]);state.templates=Object.assign(state.templates,x.templates||{});save();render();show('Backup merged.')}catch(err){show(err.message,true)}};$('#crawl').onclick=crawl;$('#sync').onclick=sync;$('#backup').onclick=function(){download('outreach-radar-backup.json',state)};$('#export').onclick=function(){download('canonical-commercial-ledger-linkedin.json',{version:1,exportedAt:new Date().toISOString(),people:state.people})};['search','sort','verified'].forEach(function(id){$('#'+id).oninput=render});render();waitBridge();
})();
</script></body></html>
