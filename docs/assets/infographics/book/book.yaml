# The Book: single source of truth for order, chapters and status. Edit this file, then run
#   python3 kit/book_build.py          (from docs/assets/infographics/)
# It renders the cards, copies the PNGs to public/, and regenerates src/data/infographicBook.ts,
# the generated blocks of BOOK.md and book/sheet.png. See kit/README.md (Book recipes).
#
# Card entry:    - {id, spec, status}   spec = path of <card>.card.yaml relative to this file.
#                title and caption are read from the spec (one place), never typed here.
# status:        draft | approved | to-make, optionally followed by a version: "draft v4".
# Placeholder:   a chapter or section with `status: to-make` and no cards, or a card entry with
#                status: to-make and no spec (title:/caption: given here). Shown in the contents as
#                "(to make)"; not rendered, not in the reader's card grid.
# Chapter:       number, title, optional note (shown in the reader), optional toc (replaces the
#                automatic suffix in BOOK.md contents), sections: [...] or cards: [...].
